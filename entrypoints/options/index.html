<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>虚無ログ 設定</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="app">
      <h1>虚無ログ 設定</h1>

      <section id="permission-banner" hidden>
        <p>YouTube 上での計測を続けるには権限の許可が必要です。</p>
        <button id="grant-permission">権限を許可する</button>
      </section>

      <section>
        <h2>集計設定</h2>
        <label>日付境界（時） <select id="day-boundary-hour"></select></label>
        <fieldset>
          <legend>週の開始</legend>
          <label><input type="radio" name="week-start" value="monday" /> 月曜始まり</label>
          <label><input type="radio" name="week-start" value="sunday" /> 日曜始まり</label>
        </fieldset>
      </section>

      <section>
        <h2>表示名</h2>
        <label>表示名（任意） <input type="text" id="display-name" /></label>
      </section>

      <section>
        <h2>Discord</h2>
        <label>Webhook URL <input type="password" id="discord-webhook-url" autocomplete="off" /></label>
        <fieldset>
          <legend>投稿形式</legend>
          <label><input type="radio" name="discord-format" value="embed" /> 埋め込み</label>
          <label><input type="radio" name="discord-format" value="content" /> プレーンテキスト</label>
        </fieldset>
      </section>

      <section>
        <h2>投稿テンプレート</h2>
        <label>X 用 <textarea id="template-x" rows="5"></textarea></label>
        <label>Discord 用 <textarea id="template-discord" rows="5"></textarea></label>
      </section>

      <section>
        <h2>計測対象プラットフォーム</h2>
        <label><input type="checkbox" id="platform-youtube-shorts" checked disabled /> YouTube Shorts</label>
      </section>

      <button id="save">保存</button>
      <p id="save-status" role="status"></p>

      <section>
        <h2>エクスポート / インポート</h2>
        <label>期間
          <select id="export-period">
            <option value="all">全期間</option>
            <option value="last30">直近30日</option>
            <option value="month">年月指定</option>
          </select>
        </label>
        <label>年月（年月指定時のみ使用） <input type="month" id="export-month" /></label>
        <button id="export-csv">CSV エクスポート</button>
        <button id="export-json">JSON バックアップ出力</button>
        <label>JSON バックアップ取り込み <input type="file" id="import-json" accept="application/json" /></label>
      </section>

      <section>
        <h2>データ削除</h2>
        <button id="delete-all">全データ削除</button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
